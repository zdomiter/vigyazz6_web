<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <title>Vigyáz(z) 6!</title>
    <meta name="description" content="A Vigyázz6! kártyajáték pontszámoló segédje segít a körönkénti pontok rögzítésében és a játék végeredményének számításában – egyszerűen és gyorsan!">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="game">
    <div id="main-content">
        <div class="navbar navbar-expand-lg navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="okorfej_feher_100.png" alt="Vigyázz 6 Ökörfej ikon" width="25" height="25"
                        class="d-inline-block align-text-top">
                        <span id="nav-brand">Vigyáz(z) 6!</span>
                </a>
                <div class="language-picker">
                    <form action="" class="language-picker__form">
                        <div class="dropdown">
                            <button class="btn btn-dark dropdown-toggle d-flex align-items-center" type="button" id="languageDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                <span class="bi bi-globe"></span>
                                <span id="selected-lang" class="ms-1"></span>
                            </button>
                            <ul class="dropdown-menu" aria-labelledby="languageDropdown">
                                <li><a class="dropdown-item" href="#" data-lang="de">Deutsch</a></li>
                                <li><a class="dropdown-item" href="#" data-lang="en">English</a></li>
                                <li><a class="dropdown-item" href="#" data-lang="hu">Magyar</a></li>
                            </ul>
                        </div>
                    </form>
                </div>                
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">
                                <i class="bi bi-6-square"></i> <span id="nav-game">Játék</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="player.html">
                                <i class="bi bi-person-vcard"></i> <span id="nav-players">Játékosok</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="history.html">
                                <i class="bi bi-clock-history"></i> <span id="nav-history">Előzmények</span>
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="game_rules.html">
                                <i class="bi bi-file-text"></i> <span id="nav-rules">Játékszabály</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="container-fluid fullscreen-mobile mt-2">
            <div id="players-container"></div>
        </div>
        <!-- Pontbekérő Modal -->
        <div class="modal fade" id="pointsModal" tabindex="-1" aria-labelledby="pointsModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="pointsModalLabel">Hány pontot gyűjtött ebben a körben?</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="playerPrompt"></p>
                        <input type="number" id="pointsInput" class="form-control" min="0" required>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-primary" id="savePoints">Mentés</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        &copy; 2025 Domiter Zoltán – Minden jog fenntartva.
    </footer>

    <script type="module" src="language.js"></script>
    <script type="module" src="game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
